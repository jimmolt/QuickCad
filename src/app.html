<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="QuickCad">
<title>QuickCad</title>
<style>
:root{
  --ia:#58a6ff; --iy:#ffc93c; --ig:#4cd08a; --ir:#ff7b72;
  --bg:#14181d; --panel:#1c2229; --panel2:#232a33; --line:#313a45; --text:#e6ebf0; --dim:#8d99a6;
  --accent:#ff9f1c; --accent-ink:#1a1206; --danger:#ff5d5d; --ok:#4cd08a; --key:#2a323c;
}
:root.light{
  --ia:#1769d1; --iy:#d98a00; --ig:#178a4c; --ir:#c62828;
  --bg:#eef1f4; --panel:#ffffff; --panel2:#f3f5f7; --line:#cfd6dd; --text:#18202a; --dim:#5d6975;
  --accent:#d97a00; --accent-ink:#ffffff; --danger:#c62828; --ok:#1c8a52; --key:#e7ebef;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);
  font:14px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
#app{display:flex;flex-direction:column;height:100%}
#top{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
#brand{font-weight:800;letter-spacing:.3px;font-size:16px;margin-right:4px}
#brand span{color:var(--accent)}
#pname{flex:0 1 200px;min-width:70px;background:var(--panel2);border:1px solid var(--line);color:var(--text);
  border-radius:8px;padding:7px 10px;font:inherit;-webkit-user-select:text;user-select:text}
.sp{flex:1}
#escBtn{width:auto;padding:0 12px;font-weight:700;font-size:14px}
.ib{width:42px;height:38px;border-radius:8px;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--line)}
.ib:active{background:var(--accent);color:var(--accent-ink)}
.ib[disabled]{opacity:.35}
.ib svg,.rb svg,.cb svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#menuBtn{display:none}
#tabs{display:flex;gap:2px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.tab{padding:7px 14px;border-radius:8px 8px 0 0;color:var(--dim);font-weight:600;font-size:13px}
.tab.on{background:var(--panel2);color:var(--text);box-shadow:inset 0 2px 0 var(--accent)}
.tab small{font-weight:500;opacity:.7;margin-left:5px}
#ribbon{display:flex;gap:0;background:var(--panel2);border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;flex:none}
#ribbon::-webkit-scrollbar{display:none}
.grp{display:flex;flex-direction:column;padding:4px 7px 2px;border-right:1px solid var(--line);flex:none}
.grp .btns{display:flex;gap:2px;flex:1;align-items:center}
.grp .grid{display:grid;grid-template-rows:repeat(2,29px);grid-auto-flow:column;gap:2px}
.grp .stack{display:grid;grid-template-rows:repeat(2,29px);grid-auto-flow:column;gap:2px 2px;margin-left:2px}
.grp .gl{font-size:9.5px;text-transform:uppercase;letter-spacing:.9px;color:var(--dim);text-align:center;padding-top:1px}
.rb{width:58px;height:60px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:10.5px;line-height:1.1;color:var(--text);border:1px solid transparent;text-align:center}
.rb svg{width:28px;height:28px}
.rb span{max-width:100%;overflow:hidden}
.sb{height:29px;padding:0 8px 0 6px;border-radius:7px;display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text);border:1px solid transparent;white-space:nowrap}
.sb svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.cb{width:36px;height:29px;border-radius:7px;display:grid;place-items:center;border:1px solid transparent}
.cb svg{width:21px;height:21px}
.rb:active,.cb:active,.sb:active{background:var(--key)}
svg .a{stroke:var(--ia)} svg .y{fill:var(--iy);stroke:none} svg .s{fill:currentColor;opacity:.16;stroke:none} svg .g{stroke:var(--ig)} svg .r{stroke:var(--ir)}
.on svg .a,.on svg .g,.on svg .r,.hov svg .a{stroke:currentColor} .on svg .y,.hov svg .y{fill:currentColor}
#ribbon.c1 .sb span{display:none} #ribbon.c1 .sb{padding:0;width:34px;justify-content:center} #ribbon.c1 .rb{width:54px}
#ribbon.c2 .rb{width:47px;font-size:9px;letter-spacing:-.2px} #ribbon.c2 .rb span{overflow:visible} #ribbon.c2 .grp{padding:4px 4px 2px} #ribbon.c2 .cb{width:32px} #ribbon.c2 .sb{width:31px}
#ribbon.c3 .rb{width:40px;height:44px} #ribbon.c3 .rb span{display:none} #ribbon.c3 .cb{width:29px} #ribbon.c3 .sb{width:29px} #ribbon.c3 .gl{font-size:8px;letter-spacing:.3px}
.rb.hasvar{position:relative;touch-action:none;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.rb.hasvar::after{content:'';position:absolute;right:4px;bottom:4px;border:3.5px solid transparent;border-bottom-color:currentColor;border-right-color:currentColor;opacity:.55}
.varmenu{position:fixed;z-index:60;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px;box-shadow:0 10px 30px rgba(0,0,0,.45);min-width:200px}
.varmenu .vi{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;font-size:14.5px;font-weight:600;color:var(--text)}
.varmenu .vi svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.varmenu .vi.cur{box-shadow:inset 3px 0 0 var(--accent)}
.varmenu .vi.hov{background:var(--accent);color:var(--accent-ink)}
.rb.on,.cb.on,.sb.on{background:var(--accent);color:var(--accent-ink)}
#main{flex:1;display:flex;min-height:0;position:relative}
#browser{width:216px;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;flex:none;padding:6px 0 20px}
#browser h4{margin:10px 12px 4px;font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim);font-weight:700}
#browser .root{padding:6px 12px;font-weight:700;display:flex;gap:8px;align-items:center}
#browser .sub{padding:0 12px 4px 12px;color:var(--dim);font-size:12px}
.row{display:flex;align-items:center;gap:8px;padding:8px 12px;min-height:38px;border-left:3px solid transparent}
.row.on{background:var(--panel2);border-left-color:var(--accent)}
.row .tg{width:22px;height:22px;border-radius:5px;background:var(--key);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.row .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .vl{color:var(--accent);font-variant-numeric:tabular-nums}
.row .x.eye{width:34px;height:34px;color:var(--dim)} .row .x.eye.on{color:var(--accent)} .row .x.eye svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.row .x{width:28px;height:28px;border-radius:6px;color:var(--dim);display:grid;place-items:center;font-size:16px}
#stage{flex:1;position:relative;min-width:0;overflow:hidden;background:var(--bg)}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:none}
#status{display:flex;gap:12px;align-items:center;padding:5px 12px;background:var(--panel);border-top:1px solid var(--line);
  font-size:12px;color:var(--dim);min-height:28px}
#hint{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dof.ok{color:var(--ok)} #dof.bad{color:var(--danger)}
#xy{font-variant-numeric:tabular-nums;min-width:120px;text-align:right}
#toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--text);color:var(--bg);
  padding:9px 14px;border-radius:10px;font-weight:600;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:86%;text-align:center;z-index:6}
#toast.on{opacity:.96}
#cutbar{position:absolute;left:50%;top:58px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:var(--panel,#222);color:var(--text);border:1px solid var(--line,#444);border-radius:12px;padding:6px 8px 6px 14px;box-shadow:0 4px 18px rgba(0,0,0,.35);z-index:30;font-size:14px}
#cutbar button{min-height:40px;padding:0 14px;border-radius:9px}
#cutbar button{background:var(--panel2);border:1px solid var(--line);color:var(--text)}
#cutbar button.pri{background:#ff9f1c;border-color:#ff9f1c;color:#14181d;font-weight:600}
#cutbar button:disabled{opacity:.4}
#exbar{position:absolute;left:50%;bottom:56px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:var(--panel,#222);color:var(--text);border:1px solid var(--line,#444);border-radius:12px;padding:6px 8px 6px 14px;box-shadow:0 4px 18px rgba(0,0,0,.35);z-index:30;font-size:14px;max-width:96%;flex-wrap:wrap}
#exbar button{min-height:40px;padding:0 12px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);color:var(--text)}
#exbar button.pri,#exbar button.on{background:#ff9f1c;border-color:#ff9f1c;color:#14181d;font-weight:600}
#exbar input{width:84px;min-height:40px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:16px;padding:0 8px;text-align:right}
#exbar .nm{font-weight:600}
#flpanel{position:absolute;right:112px;top:58px;width:292px;max-width:calc(100% - 24px);background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:10px 12px 12px;box-shadow:0 6px 24px rgba(0,0,0,.4);z-index:31;font-size:14px}
#flpanel .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:16px}
#flpanel .x{width:34px;height:34px;border-radius:8px;background:transparent;color:var(--dim)}
#flpanel .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#flpanel label{display:block;font-size:11px;color:var(--dim);margin:6px 0 3px}
#flpanel input{width:100%;box-sizing:border-box;height:40px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:0 10px;font-size:16px}
#flpanel .sb{display:flex;gap:6px}
#flpanel .sb button{flex:1;min-height:40px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);color:var(--text)}
#flpanel .sb button.on{background:#ff9f1c;border-color:#ff9f1c;color:#14181d;font-weight:600}
#flpanel .lnk{background:none;border:0;color:var(--dim);padding:8px 0 2px;min-height:0}
#flpanel .note{font-size:12px;color:var(--dim);margin-top:6px;line-height:1.35}
#flpanel .btnrow{display:flex;gap:6px;margin-top:10px}
#flpanel .btnrow button{flex:1;min-height:42px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);color:var(--text)}
#flpanel .btnrow button.pri{background:#ff9f1c;border-color:#ff9f1c;color:#14181d;font-weight:600}
#pop{position:absolute;z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;
  box-shadow:0 10px 30px rgba(0,0,0,.35);width:232px;display:none}
#pop.on{display:block}
#pop .ttl{display:flex;align-items:center;font-weight:700;font-size:13px;margin-bottom:8px;cursor:move;touch-action:none}
#pop .ttl .x{margin-left:auto;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--dim);font-size:18px}
.fld{display:flex;align-items:center;gap:8px;margin-bottom:6px;padding:7px 10px;border-radius:9px;border:1.5px solid var(--line);background:var(--panel2)}
.fld.on{border-color:var(--accent)}
.fld .fl{font-size:12px;color:var(--dim);flex:1}
.fld .fv{flex:none;padding:0 5px;text-align:right;font-size:18px;font-weight:650;font-variant-numeric:tabular-nums;min-height:23px;white-space:nowrap;overflow:hidden}
.fld .fv.sel{background:color-mix(in srgb,var(--accent) 35%,transparent);border-radius:4px}
.fld .fu{font-size:12px;color:var(--dim);flex:none;min-width:14px}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:8px}
.keys button{height:42px;border-radius:9px;background:var(--key);font-size:17px;font-weight:600}
.keys button:active{background:var(--accent);color:var(--accent-ink)}
.keys .okk{background:var(--accent);color:var(--accent-ink)}
.acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.acts button{flex:1;min-height:38px;border-radius:9px;background:var(--key);font-weight:600;font-size:12.5px;padding:0 8px;white-space:nowrap}
.acts button.dg{color:var(--danger)}
.acts button.on{background:var(--accent);color:var(--accent-ink)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;place-items:center;z-index:20;padding:16px}
#modal.on{display:grid}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;width:min(460px,100%);max-height:92%;overflow:auto;-webkit-user-select:text;user-select:text}
.dlg h3{margin:0 0 12px;font-size:17px}
.dlg label{display:block;font-size:12px;color:var(--dim);margin:10px 0 4px}
.dlg input[type=text]{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:10px 12px;font:inherit;font-size:15px}
.dlg .info{background:var(--panel2);border-radius:10px;padding:10px 12px;margin-top:12px;font-size:13px;line-height:1.55}
.dlg .info b{color:var(--accent)}
.dlg .btnrow{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.dlg .btnrow button{flex:1;min-height:44px;border-radius:10px;background:var(--key);font-weight:650;padding:0 12px}
.dlg .btnrow button.pri{background:var(--accent);color:var(--accent-ink)}
.dlg .note{font-size:12px;color:var(--dim);margin-top:10px;line-height:1.45}
.dlg .sw{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);gap:12px}
.dlg .sw button{min-width:74px;height:36px;border-radius:9px;background:var(--key);font-weight:650}
.dlg .sw button.on{background:var(--accent);color:var(--accent-ink)}
#gl{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:none}
#stage.model #gl{display:block} #stage.model #cv{display:none}
#stage.skbd #gl{display:block;pointer-events:none;z-index:0}
#stage.skbd #cv{z-index:1}
#vcube{position:absolute;right:18px;top:18px;width:84px;height:84px;display:none;z-index:3}
#vcube .cube{position:absolute;left:17px;top:17px;width:50px;height:50px;transform-style:preserve-3d}
#vcube .f{position:absolute;inset:0;display:grid;place-items:center;font-size:9px;font-weight:800;letter-spacing:.3px;background:var(--panel2);
  border:1.5px solid var(--dim);color:var(--text);backface-visibility:hidden;-webkit-backface-visibility:hidden;cursor:pointer}
#vcube .f:active{background:var(--accent);color:var(--accent-ink)}
#vhome{position:absolute;right:30px;top:112px;display:none;z-index:3;height:30px;padding:0 12px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);font-size:12px;font-weight:650}
#minfo{position:absolute;left:12px;bottom:12px;display:none;z-index:3;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;line-height:1.5;max-width:70%}
#minfo b{color:var(--accent)}
#stage.model #vcube,#stage.model #vhome,#stage.model #minfo,#stage.flat #minfo{display:block}
#stage.flat #cv{cursor:grab}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tgrid button{min-height:46px;border-radius:9px;background:var(--key);font-weight:650;font-size:13.500px;line-height:1.2}
.tgrid button small{display:block;font-weight:500;color:var(--dim);font-size:11px}
.tgrid button.on{background:var(--accent);color:var(--accent-ink)} .tgrid button.on small{color:var(--accent-ink)}
.dlg .inl{display:flex;gap:8px} .dlg .inl button{min-width:84px;border-radius:9px;background:var(--key);font-weight:650}
#scrim{display:none}
@media (max-width:760px){
  #menuBtn{display:grid}
  #browser{position:absolute;left:0;top:0;bottom:0;z-index:8;transform:translateX(-102%);transition:transform .2s;box-shadow:8px 0 24px rgba(0,0,0,.35);width:250px}
  #browser.open{transform:none}
  #scrim.on{display:block;position:absolute;inset:0;z-index:7;background:rgba(0,0,0,.35)}
  #pop{left:8px!important;right:8px;top:auto!important;bottom:8px;width:auto}
  #pop .keys button{height:40px}
  #xy{display:none}
  #brand{font-size:14px}
  .hide-sm{display:none}
}
</style>
</head>
<body>
<div id="app">
  <header id="top">
    <button class="ib" id="menuBtn" aria-label="Feature browser"></button>
    <div id="brand">Quick<span>Cad</span></div>
    <input id="pname" type="text" value="Sketch1" aria-label="Part name" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="sp"></div>
    <button class="ib" id="escBtn" aria-label="Escape — stop the current tool" title="Stop the current tool">Esc</button>
    <button class="ib" id="undoBtn" aria-label="Undo"></button>
    <button class="ib" id="redoBtn" aria-label="Redo"></button>
    <button class="ib" id="fitBtn" aria-label="Zoom to fit"></button>
    <button class="ib hide-sm" id="newBtn" aria-label="New sketch"></button>
    <button class="ib" id="openBtn" aria-label="Open part file"></button>
    <button class="ib" id="saveBtn" aria-label="Save part file"></button>
    <button class="ib" id="setBtn" aria-label="Settings"></button>
  </header>
  <nav id="tabs">
    <button class="tab on" data-tab="sketch">Sketch</button>
    <button class="tab" data-tab="sm">Sheet Metal</button>
    <button class="tab" data-tab="3d">3D Model</button>
  </nav>
  <div id="ribbon"></div>
  <div id="main">
    <aside id="browser"></aside>
    <div id="scrim"></div>
    <div id="stage">
      <canvas id="cv"></canvas>
      <canvas id="gl"></canvas>
      <div id="vcube"><div class="cube"></div></div>
      <button id="vhome" aria-label="Home view">Home</button>
      <div id="minfo"></div>
      <div id="pop"></div>
      <div id="toast"></div>
    </div>
  </div>
  <footer id="status"><div id="hint"></div><div id="dof"></div><div id="xy"></div></footer>
</div>
<div id="modal"></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
<script>/*__THREE__*/</script>
<script>/*__SOLVER__*/</script>
<script>var WASM_B64="__WASM__";</script>
<script>/*__MANIFOLD__*/</script>
<script>var MF_B64="__MFWASM__";</script>
<script>
/*__APP__*/
</script>
</body>
</html>
